<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students</title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'css/style1.css' %}">

</head>

<body>

<div class="container">

    <h1 class="heading">
        Registered Students
    </h1>


    <table class="student-table">

        <tr>
            <th>Student ID</th>
            <th>Student Name</th>
        </tr>


        {% for student in students %}

        <tr>
            <td>{{ student.student_id }}</td>
            <td>{{ student.name }}</td>
        </tr>

        {% empty %}

        <tr>
            <td colspan="2">No Students Registered</td>
        </tr>

        {% endfor %}


    </table>


    <a href="{% url 'home' %}">
        <button class="btn">
            Back Home
        </button>
    </a>


</div>


</body>

</html>
